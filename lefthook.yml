glob_matcher: doublestar

# 道具（shfmt・shellcheck・gitleaks・cog・Bats）は devShell が提供する。
# oxfmt は development/ の依存で動くので、新しい clone や worktree では先に導入する。
pre-commit:
  parallel: true
  jobs:
    - name: format
      run: >-
        test -x development/node_modules/.bin/oxfmt || { echo 'format: oxfmt がない。npm ci --prefix development を実行してから commit する' >&2; exit 1; } && npm run format:check
    - name: shell
      run: npm run lint:sh
      # lint:sh の対象と揃える。対象を広げるときはここも広げる。
      glob:
        - "bin/**"
        - "lib/bun/run"
        - "skills/*-peer-refactor/scripts/check-architecture-report"
        - "skills/*-peer-refactor/scripts/candidate-record"
        - "skills/*-peer-refactor/scripts/run-evidence"
        - "tests/cli/git-push-topic.bats"
        - ".editorconfig"
        - "package.json"
    - name: docstrings
      run: npm run --silent report:docstrings
    - name: gitleaks
      run: gitleaks protect --staged -v
    # workflow の SHA 固定を先に直し、その結果を lint する（dotfiles と同じ順序）。
    - name: workflows
      group:
        piped: true
        jobs:
          - name: pinact
            run: pinact run {staged_files}
            glob: ".github/workflows/*.{yaml,yml}"
            stage_fixed: true
          - name: actionlint
            run: actionlint {staged_files}
            glob: ".github/workflows/*.{yaml,yml}"
          - name: ghalint
            run: ghalint run {staged_files}
            glob: ".github/workflows/*.{yaml,yml}"

# 全 suite（npm test）の代わりに、sandbox に依存しない公開 suite だけを通す。
# raw Codex・browser・Node の suite は、docs/verification.md の手順で別に実行する。
pre-push:
  jobs:
    - name: tests
      # hook が設定する GIT_DIR と GIT_PREFIX は、テストの fixture の Git を実 repo へ向けてしまう。
      run: unset GIT_DIR GIT_PREFIX; npm run typecheck && npm run test:bun && npm run test:python && bats tests/*.bats tests/cli/*.bats

commit-msg:
  jobs:
    - name: conventional-commits
      run: cog verify --ignore-merge-commits --file "{1}"
