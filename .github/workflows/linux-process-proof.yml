name: Linux process proof
run-name: "${{ inputs.mode == 'probe-environment' && 'Linux namespace 環境比較' || inputs.mode == 'probe-caller' && 'Linux namespace caller比較' || inputs.mode == 'probe-isolate' && 'Linux namespace 独立測定' || inputs.mode == 'probe-minimize' && 'Linux namespace オプション削減' || inputs.mode == 'probe-loop' && 'Linux namespace 再現ループ' || 'Linux process proof' }}: ${{ inputs.source_sha }}"

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 検査対象の完全な commit SHA（40桁）
        required: true
        type: string
      mode:
        description: 実行範囲（診断は正式実証と別に記録）
        required: false
        default: proof
        type: choice
        options:
          - proof
          - probe-loop
          - probe-minimize
          - probe-isolate
          - probe-caller
          - probe-environment

concurrency:
  group: linux-process-proof-${{ inputs.source_sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}

jobs:
  proof:
    permissions:
      contents: read
    name: "${{ inputs.mode == 'probe-environment' && 'namespace 環境比較' || inputs.mode == 'probe-caller' && 'namespace caller比較' || inputs.mode == 'probe-isolate' && 'namespace 独立測定' || inputs.mode == 'probe-minimize' && 'namespace オプション削減' || inputs.mode == 'probe-loop' && 'namespace 再現ループ' || 'Linux 追加実証' }} (${{ matrix.arch }})"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    env:
      PROOF_SOURCE_SHA: ${{ inputs.source_sha }}
      PROOF_ARCH: ${{ matrix.arch }}
      PROOF_MODE: ${{ inputs.mode || 'proof' }}
    steps:
      - name: 入力 SHA と方式を検査
        run: |
          [[ "$PROOF_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PROOF_MODE" == proof || "$PROOF_MODE" == probe-loop || "$PROOF_MODE" == probe-minimize || "$PROOF_MODE" == probe-isolate || "$PROOF_MODE" == probe-caller || "$PROOF_MODE" == probe-environment ]]
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_sha }}
          path: subject
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: CI 専用依存と補助 group を準備
        if: inputs.mode != 'probe-isolate' && inputs.mode != 'probe-caller' && inputs.mode != 'probe-environment'
        run: |
          mkdir -p "$RUNNER_TEMP/linux-proof"
          bash control/development/setup-linux-process-proof.sh "$GITHUB_WORKSPACE/subject" "$RUNNER_TEMP/linux-proof" \
            2>&1 | tee "$RUNNER_TEMP/linux-proof/setup.log"
      - name: 非root で全44件を3反復
        if: inputs.mode == 'proof' || !inputs.mode
        run: bun control/development/run-linux-process-proof.ts run "$GITHUB_WORKSPACE/subject" "$RUNNER_TEMP/linux-proof"
      - name: 同じ条件のnamespace probeを3回測定
        if: inputs.mode == 'probe-loop'
        run: bun control/development/run-linux-process-proof.ts probe-loop "$GITHUB_WORKSPACE/subject" "$RUNNER_TEMP/linux-proof"
      - name: namespaceオプションを一つずつ削減
        if: inputs.mode == 'probe-minimize'
        run: bun control/development/run-linux-process-proof.ts probe-minimize "$GITHUB_WORKSPACE/subject" "$RUNNER_TEMP/linux-proof"
      - name: 専用準備なしで元argv・最小候補・対照を各3回測定
        if: inputs.mode == 'probe-isolate'
        run: |
          [[ "$(readlink -f "$(command -v unshare)")" == /usr/bin/unshare ]]
          bun control/development/run-linux-process-proof.ts probe-isolate "$GITHUB_WORKSPACE/subject" "$RUNNER_TEMP/linux-proof"
      - name: 同じ測定コードでBunとNodeのcallerを比較
        if: inputs.mode == 'probe-caller'
        timeout-minutes: 2
        run: node control/development/probe-linux-namespace-caller.mjs run "$GITHUB_WORKSPACE/subject" "$RUNNER_TEMP/linux-proof" "$(command -v bun)"
      - name: Nodeを固定してunshareの継承環境と空環境を比較
        if: inputs.mode == 'probe-environment'
        timeout-minutes: 2
        run: node control/development/probe-linux-namespace-caller.mjs environment "$GITHUB_WORKSPACE/subject" "$RUNNER_TEMP/linux-proof"
      - name: 成功・失敗の生証跡を保存
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.mode == 'probe-environment' && 'namespace-environment' || inputs.mode == 'probe-caller' && 'namespace-caller' || inputs.mode == 'probe-isolate' && 'namespace-isolate' || inputs.mode == 'probe-minimize' && 'namespace-minimize' || inputs.mode == 'probe-loop' && 'namespace-loop' || 'linux-proof' }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/linux-proof/
          if-no-files-found: error
          retention-days: 90
          overwrite: false

  aggregate:
    permissions:
      contents: read
    name: 両 architecture と履歴を照合
    if: always() && (inputs.mode == 'proof' || !inputs.mode)
    needs: proof
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PROOF_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: 入力 SHA を検査
        run: '[[ "$PROOF_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_sha }}
          path: subject
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: 同じ run・attempt の証跡を取得
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-proof-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/raw
      - name: raw log・metadata・過去 attempt を照合
        if: always()
        run: bun control/development/run-linux-process-proof.ts aggregate "$GITHUB_WORKSPACE/subject" "$RUNNER_TEMP/raw" "$RUNNER_TEMP/result"
      - name: Git 管理へ移す判定候補を保存
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-proof-verdict-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: error
          retention-days: 90
          overwrite: false
